name: Build kernelsu.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev

      - name: Download Clang r383902b1 (LineageOS Mirror)
        run: |
          git clone --depth 1 -b android-11.0.0_r48 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86.git clang-repo
          mv clang-repo/clang-r383902b1 ./clang
          rm -rf clang-repo
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Auto-fix missing Kconfigs
        run: |
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("."):
              if "Kconfig" in files:
                  fpath = os.path.join(root, "Kconfig")
                  with open(fpath, "r") as f:
                      lines = f.readlines()
                  changed = False
                  for i, line in enumerate(lines):
                      m = re.match(r"^\s*source\s+\"([^\"]+)\"", line)
                      if m:
                          target = m.group(1)
                          if not os.path.exists(target):
                              lines[i] = "# " + line
                              changed = True
                  if changed:
                      with open(fpath, "w") as f:
                          f.writelines(lines)
          print("Kconfig auto-fix completed.")
          '

      - name: Prepare config (Force 64BIT)
        run: |
          mkdir -p out
          cp config.txt out/.config
          sed -i '/CONFIG_64BIT/d' out/.config
          sed -i '/CONFIG_ARM64/d' out/.config
          echo 'CONFIG_64BIT=y' >> out/.config
          echo 'CONFIG_ARM64=y' >> out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig </dev/null
          make ARCH=arm64 LLVM=1 O=out syncconfig </dev/null
          echo "=== 检查 CONFIG_64BIT 是否生效 ==="
          grep "CONFIG_64BIT" out/.config

      - name: Extract and Copy Module.symvers
        run: |
          gzip -d -c Module.symvers.gz > Module.symvers
          cp Module.symvers out/Module.symvers

      - name: Build kernelsu.ko
        run: |
          make -j2 ARCH=arm64 LLVM=1 O=out CONFIG_DEBUG_INFO=n drivers/kernelsu/ </dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/drivers/kernelsu/kernelsu.ko
