name: Build kernelsu.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev


      - name: Download clang-r383902b1 (Release Direct)
        run: |
          wget -q "https://github.com/Zycromerz/Clang/releases/download/11.0.2-release/Clang-11.0.2.tar.gz" -O clang.tar.gz
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang
          if [ -d "clang/bin" ]; then
            echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/clang/Clang-11.0.2/bin" >> "$GITHUB_PATH"
          fi
      - name: Prepare config
        run: |
          mkdir -p out
          cp config.txt out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig </dev/null
          make ARCH=arm64 LLVM=1 O=out syncconfig </dev/null

      - name: Copy Module.symvers
        run: cp Module.symvers out/Module.symvers

      - name: Build kernelsu.ko
        run: make -j"$(nproc)" ARCH=arm64 LLVM=1 O=out drivers/kernelsu/ </dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/drivers/kernelsu/kernelsu.ko
