name: Build kernelsu.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Checkout Clang
        uses: actions/checkout@v4
        with:
          repository: TrellixVulnTeam/platform_prebuilts_clang_host_linux-x86_5FOJ
          ref: eleven
          path: clang-repo

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev

      - name: Setup Clang
        run: |
          mv clang-repo/clang-r383902b1 ./clang
          rm -rf clang-repo
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Auto-fix missing Kconfigs
        run: |
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("."):
              if "Kconfig" in files:
                  fpath = os.path.join(root, "Kconfig")
                  with open(fpath, "r") as f:
                      lines = f.readlines()
                  changed = False
                  for i, line in enumerate(lines):
                      m = re.match(r"^\s*source\s+\"([^\"]+)\"", line)
                      if m:
                          target = m.group(1)
                          if not os.path.exists(target):
                              lines[i] = "# " + line
                              changed = True
                  if changed:
                      with open(fpath, "w") as f:
                          f.writelines(lines)
          print("Kconfig auto-fix completed.")
          '

      - name: Prepare config (Force 64BIT)
        run: |
          mkdir -p out
          cp config.txt out/.config
          sed -i '/CONFIG_64BIT/d' out/.config
          sed -i '/CONFIG_ARM64/d' out/.config
          echo 'CONFIG_64BIT=y' >> out/.config
          echo 'CONFIG_ARM64=y' >> out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          
          make ARCH=arm64 LLVM=1 O=out olddefconfig </dev/null
          make ARCH=arm64 LLVM=1 O=out syncconfig </dev/null
          
          echo "=== 检查 out/.config 里的 CONFIG_64BIT ==="
          grep "CONFIG_64BIT" out/.config || true
          echo "=== 检查生成的 autoconf.h 里的 CONFIG_64BIT ==="
          grep "CONFIG_64BIT" out/include/generated/autoconf.h || true

      - name: Extract and Copy Module.symvers
        run: |
          gzip -d -c Module.symvers.gz > Module.symvers
          cp Module.symvers out/Module.symvers

      - name: Build kernelsu.ko
        run: |
          # 注入 KCFLAGS，强制给 C 编译器喂宏，彻底绕开 Kconfig 的脑残冲突
          make -j2 ARCH=arm64 LLVM=1 O=out KCFLAGS="-DCONFIG_64BIT" CONFIG_DEBUG_INFO=n drivers/kernelsu/ </dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/drivers/kernelsu/kernelsu.ko
