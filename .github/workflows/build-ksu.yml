name: Build kernelsu.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r383902b1-v2

      - name: Download clang-r383902b1
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          curl -L -o clang-repo.tar.gz "https://github.com/TrellixVulnTeam/platform_prebuilts_clang_host_linux-x86_5FOJ/archive/refs/heads/eleven.tar.gz"
          mkdir -p clang-repo
          tar -xzf clang-repo.tar.gz -C clang-repo --strip-components=1
          mv clang-repo/clang-r383902b1 ./clang
          rm -rf clang-repo clang-repo.tar.gz

      - name: Add Clang to PATH
        run: echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Auto-fix missing Kconfigs
        run: |
          # 用 Python 一键扫描并注释掉所有缺失的 source，彻底解决 OPPO 阉割问题
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("."):
              if "Kconfig" in files:
                  fpath = os.path.join(root, "Kconfig")
                  with open(fpath, "r") as f:
                      lines = f.readlines()
                  changed = False
                  for i, line in enumerate(lines):
                      m = re.match(r"^\s*source\s+\"([^\"]+)\"", line)
                      if m:
                          target = m.group(1)
                          if not os.path.exists(target):
                              lines[i] = "# " + line
                              changed = True
                  if changed:
                      with open(fpath, "w") as f:
                          f.writelines(lines)
          print("Kconfig auto-fix completed.")
          '

      - name: Prepare config
        run: |
          mkdir -p out
          cp config.txt out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          make ARCH=arm64 LLVM=1 O=out olddefconfig </dev/null
          make ARCH=arm64 LLVM=1 O=out syncconfig </dev/null

      - name: Extract and Copy Module.symvers
        run: |
          gzip -d -c Module.symvers.gz > Module.symvers
          cp Module.symvers out/Module.symvers
      - name: Build kernelsu.ko
        run: make -j"$(nproc)" ARCH=arm64 LLVM=1 O=out drivers/kernelsu/ </dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/drivers/kernelsu/kernelsu.ko
