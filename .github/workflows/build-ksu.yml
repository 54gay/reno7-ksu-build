name: Build kernelsu.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev

      - name: Download clang-11.0.2 (LLVM Official)
        run: |
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.2/clang+llvm-11.0.2-x86_64-linux-gnu-ubuntu-20.04.tar.xz" -O clang.tar.xz
          tar -xf clang.tar.xz
          mv clang+llvm-11.0.2-x86_64-linux-gnu-ubuntu-20.04 clang
          rm clang.tar.xz
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Auto-fix missing Kconfigs
        run: |
          python3 -c '
          import os, re
          for root, dirs, files in os.walk("."):
              if "Kconfig" in files:
                  fpath = os.path.join(root, "Kconfig")
                  with open(fpath, "r") as f:
                      lines = f.readlines()
                  changed = False
                  for i, line in enumerate(lines):
                      m = re.match(r"^\s*source\s+\"([^\"]+)\"", line)
                      if m:
                          target = m.group(1)
                          if not os.path.exists(target):
                              lines[i] = "# " + line
                              changed = True
                  if changed:
                      with open(fpath, "w") as f:
                          f.writelines(lines)
          print("Kconfig auto-fix completed.")
          '

      - name: Prepare config (Force 64BIT)
        run: |
          mkdir -p out
          cp config.txt out/.config
          
          # 暴力删掉可能引起冲突的选项，防止被内核自动覆盖
          sed -i '/CONFIG_64BIT/d' out/.config
          sed -i '/CONFIG_ARM64/d' out/.config
          sed -i '/CONFIG_ARM=/d' out/.config
          
          # 强行写入关键核心配置
          echo 'CONFIG_64BIT=y' >> out/.config
          echo 'CONFIG_ARM64=y' >> out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          
          make ARCH=arm64 LLVM=1 O=out olddefconfig </dev/null
          make ARCH=arm64 LLVM=1 O=out syncconfig </dev/null
          
          echo "================ 检查 CONFIG_64BIT ================"
          grep "CONFIG_64BIT" out/.config
          echo "==================================================="

      - name: Extract and Copy Module.symvers
        run: |
          gzip -d -c Module.symvers.gz > Module.symvers
          cp Module.symvers out/Module.symvers

      - name: Build kernelsu.ko
        run: |
          make -j2 ARCH=arm64 LLVM=1 O=out CONFIG_DEBUG_INFO=n drivers/kernelsu/ </dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/drivers/kernelsu/kernelsu.ko
